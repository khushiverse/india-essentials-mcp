[project]
name = "india-essentials-mcp"
version = "0.2.0"
description = "MCP server for everyday Indian lookups: IFSC codes, PIN codes and air quality."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "khushiverse" }]
keywords = ["mcp", "model-context-protocol", "india", "ifsc", "pincode", "aqi", "ai-agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/khushiverse/india-essentials-mcp"
Issues = "https://github.com/khushiverse/india-essentials-mcp/issues"

[project.scripts]
india-essentials-mcp = "india_essentials_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/india_essentials_mcp"]
